services:
  - type: web
    name: newprint3d-web
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true

    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://www.newprint3d.com"

      # Segredos (configurar no Render, não no GitHub):
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: "https://www.newprint3d.com"
